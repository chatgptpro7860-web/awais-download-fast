<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Neon Cyber Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0052d4"/>
    </linearGradient>
    
    <linearGradient id="emeraldNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="50%" stop-color="#60efff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="metallicChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cfd9df"/>
      <stop offset="70%" stop-color="#65737e"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>

    <linearGradient id="goldFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>

    <!-- Deep Glow Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#00f2fe" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)"/>

  <!-- Cyber Hexagonal Shield Outer Frame -->
  <polygon points="250,20 450,110 450,390 250,480 50,390 50,110" 
           fill="#0a0f1d" stroke="url(#cyberCyan)" stroke-width="8" filter="url(#heavyShadow)"/>
  
  <!-- Inner Shield Accent -->
  <polygon points="250,42 425,122 425,378 250,458 75,378 75,122" 
           fill="none" stroke="url(#emeraldNeon)" stroke-width="2" opacity="0.6" stroke-dasharray="15, 8"/>

  <!-- HEAVY FUTURISTIC 'X' GEOMETRY -->
  <g filter="url(#neonGlow)">
    <!-- Diagonal 1: Top-Left to Bottom-Right -->
    <path d="M 120,105 L 180,95 L 380,395 L 320,405 Z" fill="url(#cyberCyan)" opacity="0.95"/>
    <path d="M 125,110 L 175,102 L 375,390 L 325,398 Z" fill="url(#metallicChrome)" opacity="0.4"/>
    
    <!-- Diagonal 2: Top-Right to Bottom-Left -->
    <path d="M 380,105 L 320,95 L 120,395 L 180,405 Z" fill="url(#emeraldNeon)" opacity="0.95"/>
    <path d="M 375,110 L 325,102 L 125,390 L 175,398 Z" fill="url(#metallicChrome)" opacity="0.4"/>

    <!-- Central Cyber Intersection Gem / Reactor Core -->
    <polygon points="250,195 295,250 250,305 205,250" fill="#050b14" stroke="url(#goldFire)" stroke-width="4"/>
    <circle cx="250" cy="250" r="18" fill="url(#goldFire)"/>
    <circle cx="250" cy="250" r="8" fill="#ffffff"/>

    <!-- Dynamic Lightning Energy Strike -->
    <path d="M 260,140 L 230,230 L 265,230 L 235,350 L 275,250 L 245,250 Z" fill="url(#goldFire)" filter="url(#neonGlow)"/>
  </g>

  <!-- Cyberpunk Tech Corner Accents -->
  <line x1="50" y1="110" x2="90" y2="110" stroke="#00ff87" stroke-width="4"/>
  <line x1="50" y1="110" x2="50" y2="150" stroke="#00ff87" stroke-width="4"/>

  <line x1="450" y1="110" x2="410" y2="110" stroke="#00f2fe" stroke-width="4"/>
  <line x1="450" y1="110" x2="450" y2="150" stroke="#00f2fe" stroke-width="4"/>

  <line x1="250" y1="20" x2="250" y2="60" stroke="#ffe259" stroke-width="4"/>
  <line x1="250" y1="480" x2="250" y2="440" stroke="#ffe259" stroke-width="4"/>

  <!-- Logo Text Monogram: AWAISX -->
  <text x="250" y="445" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="8" filter="url(#neonGlow)">AWAISX</text>
</svg>
